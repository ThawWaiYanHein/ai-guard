replicaCount: 1

image:
  repository: ghcr.io/thawwaiyanhein/ai-guard
  tag: "0.1.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

namespace:
  create: true
  name: ai-guard-system

serviceAccount:
  create: true
  name: ""

rbac:
  create: false

agent:
  pii: "on"
  cache: "false"

webhook:
  failurePolicy: Fail
  timeoutSeconds: 10
  namespaceSelector:
    mode: opt-in
    labelKey: ai-guard.io/injection
    labelValue: enabled
    exclude:
      - ai-guard-system
      - kube-system
      - kube-public
      - kube-node-lease

tls:
  certManager:
    enabled: true
    issuer:
      create: true
      name: ai-guard-selfsigned
      kind: Issuer
    certificate:
      name: ai-guard-webhook
      duration: 8760h
      renewBefore: 720h
  crt: ""
  key: ""
  caBundle: ""
  secretName: ai-guard-webhook-tls

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "ai-guard.fullname" . }}-auto-instrumentation
  {{- if .Values.tls.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ include "ai-guard.namespace" . }}/{{ .Values.tls.certManager.certificate.name }}
  {{- end }}
  labels:
    {{- include "ai-guard.labels" . | nindent 4 }}
webhooks:
  - name: pods.ai-guard.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      service:
        namespace: {{ include "ai-guard.namespace" . }}
        name: {{ include "ai-guard.fullname" . }}-webhook
        path: /mutate
        port: 443
      {{- if not .Values.tls.certManager.enabled }}
      caBundle: {{ required "tls.caBundle is required" .Values.tls.caBundle | quote }}
      {{- end }}
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- range .Values.webhook.namespaceSelector.exclude }}
            - {{ . | quote }}
            {{- end }}

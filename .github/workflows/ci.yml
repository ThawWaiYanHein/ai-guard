name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest flask
      - name: Compile
        run: python -m compileall agent operator tests
      - name: Test
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-guard:ci .

  sdk-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install provider SDKs
        run: python -m pip install --upgrade pip openai anthropic google-genai litellm
      - name: Check adapter imports
        run: |
          PYTHONPATH=agent python - <<'PY'
          from ai_guard.config import Config
          from ai_guard.openai_adapter import patch_openai
          from ai_guard.gemini_adapter import patch_gemini
          from ai_guard.anthropic_adapter import patch_anthropic
          from ai_guard.litellm_adapter import patch_litellm

          config = Config(cache_enabled=False)
          patch_openai(config)
          patch_gemini(config)
          patch_anthropic(config)
          patch_litellm(config)
          print("provider SDK compatibility check complete")
          PY

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint charts/ai-guard
      - name: Render chart
        run: helm template ai-guard charts/ai-guard > /tmp/ai-guard.yaml
      - name: Render chart without cert-manager
        run: |
          helm template ai-guard charts/ai-guard \
            --set tls.certManager.enabled=false \
            --set tls.crt=dGVzdA== \
            --set tls.key=dGVzdA== \
            --set tls.caBundle=dGVzdA== > /tmp/ai-guard-manual-tls.yaml

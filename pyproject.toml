[project]
name = "ai-guard-auto-instrumentation"
version = "0.1.0"
description = "Kubernetes-native zero-code LLM security auto-instrumentation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI-Guard contributors" }]
keywords = ["llm", "security", "kubernetes", "auto-instrumentation", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["agent"]

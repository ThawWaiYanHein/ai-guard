apiVersion: v1
kind: Namespace
metadata:
  name: ai-guard-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-guard-operator
  namespace: ai-guard-system
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-guard-webhook-tls
  namespace: ai-guard-system
type: kubernetes.io/tls
data:
  tls.crt: ${TLS_CRT}
  tls.key: ${TLS_KEY}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-guard-operator
  namespace: ai-guard-system
  labels:
    app.kubernetes.io/name: ai-guard
    app.kubernetes.io/component: operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-guard
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-guard
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: ai-guard-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: ai-guard:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: AI_GUARD_IMAGE
              value: ai-guard:0.1.0
            - name: TLS_CERT_FILE
              value: /tls/tls.crt
            - name: TLS_KEY_FILE
              value: /tls/tls.key
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: ai-guard-webhook-tls
---
apiVersion: v1
kind: Service
metadata:
  name: ai-guard-webhook
  namespace: ai-guard-system
  labels:
    app.kubernetes.io/name: ai-guard
    app.kubernetes.io/component: operator
spec:
  selector:
    app.kubernetes.io/name: ai-guard
    app.kubernetes.io/component: operator
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: ai-guard-auto-instrumentation
webhooks:
  - name: pods.ai-guard.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        namespace: ai-guard-system
        name: ai-guard-webhook
        path: /mutate
        port: 443
      caBundle: ${CA_BUNDLE}
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - ai-guard-system
            - kube-system
            - kube-public
            - kube-node-lease
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-guard-operator
  namespace: ai-guard-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-guard
      app.kubernetes.io/component: operator
